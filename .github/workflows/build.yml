name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:4.1

    name: Build

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Cache
      # ------------------------------------------------------

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-


      # ------------------------------------------------------
      # West
      # ------------------------------------------------------

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export


      # ======================================================
      # CORNE LEFT
      # ======================================================

      - name: West Build (Corne Left)
        run: |
          west build \
            -s zmk/app \
            -b nrfmicro_13 \
            -- \
            -DSHIELD=corne_left \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"


      # ------------------------------------------------------
      # Debug: DTS
      # ------------------------------------------------------

      - name: Corne Left DTS
        if: always()
        run: |
          if [ -f build/zephyr/nrfmicro_13.dts.pre.tmp ]; then
            cat -n build/zephyr/nrfmicro_13.dts.pre.tmp
          else
            echo "DTS file not found"
          fi


      # ------------------------------------------------------
      # Debug: Kconfig
      # ------------------------------------------------------

      - name: Corne Left Kconfig
        if: always()
        run: |
          if [ -f build/zephyr/.config ]; then
            cat build/zephyr/.config | grep -v "^#" | grep -v "^$"
          else
            echo "Kconfig file not found"
          fi


      # ------------------------------------------------------
      # Rename firmware
      # ------------------------------------------------------

      - name: Rename left firmware
        run: |
          cp build/zephyr/zmk.uf2 corne_left_nrfmicro_13.uf2


      # ------------------------------------------------------
      # Upload left firmware
      # ------------------------------------------------------

      - name: Upload left firmware
        uses: actions/upload-artifact@v4
        with:
          name: corne-left-firmware
          path: corne_left_nrfmicro_13.uf2


      # ======================================================
      # CORNE RIGHT
      # ======================================================

      - name: West Build (Corne Right)
        run: |
          west build \
            --pristine \
            -s zmk/app \
            -b nrfmicro_13 \
            -- \
            -DSHIELD=corne_right \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"


      # ------------------------------------------------------
      # Debug: Kconfig
      # ------------------------------------------------------

      - name: Corne Right Kconfig
        if: always()
        run: |
          if [ -f build/zephyr/.config ]; then
            cat build/zephyr/.config | grep -v "^#" | grep -v "^$"
          else
            echo "Kconfig file not found"
          fi


      # ------------------------------------------------------
      # Rename firmware
      # ------------------------------------------------------

      - name: Rename right firmware
        run: |
          cp build/zephyr/zmk.uf2 corne_right_nrfmicro_13.uf2


      # ------------------------------------------------------
      # Upload right firmware
      # ------------------------------------------------------

      - name: Upload right firmware
        uses: actions/upload-artifact@v4
        with:
          name: corne-right-firmware
          path: corne_right_nrfmicro_13.uf2